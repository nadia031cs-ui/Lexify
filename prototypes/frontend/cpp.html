<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexify – C++ Compiler</title>

    <style>
        /* ---------- Theme tokens (light) ---------- */
        :root {
            --bg: #f8f2f4;
            --bg-glow: rgba(229, 23, 63, .10);
            --header-bg: #ffffff;
            --side-bg: #ffffff;
            --panel: #ffffff;
            --panel-2: #fcf4f6;
            --code-bg: #fdf8f9;
            --line: #ecd8de;
            --ink: #14203a;
            --ink-soft: #5b6b8c;
            --accent: #d9163c;
            --accent-ink: #ffffff;
            --accent-soft: #fde6eb;
            --danger: #d64545;
            --shadow: 0 1px 2px rgba(20, 32, 58, .05), 0 8px 24px rgba(20, 32, 58, .06);

            --tk-comment: #7a88a8;
            --tk-pre: #b0189a;
            --tk-string: #0a8a3a;
            --tk-number: #b4570a;
            --tk-keyword: #b0189a;

            --header-h: 68px;
            --side-w: 250px;
            --radius: 14px;
            color-scheme: light;
        }

        /* ---------- Theme tokens (dark) ---------- */
        :root[data-theme="dark"] {
            --bg: #070a18;
            --bg-glow: rgba(229, 23, 63, .22);
            --header-bg: #0a0d1f;
            --side-bg: #0a0d1f;
            --panel: #0d1126;
            --panel-2: #141830;
            --code-bg: #070a18;
            --line: #34162b;
            --ink: #e8efff;
            --ink-soft: #9db0d6;
            --accent: #e5173f;
            --accent-ink: #ffffff;
            --accent-soft: #3a0f22;
            --danger: #ff7b7b;
            --shadow: 0 0 0 1px rgba(255, 40, 80, .06), 0 12px 40px rgba(0, 0, 20, .5);

            --tk-comment: #6c7fa8;
            --tk-pre: #f06bd0;
            --tk-string: #5be37d;
            --tk-number: #ffb86b;
            --tk-keyword: #f06bd0;
            color-scheme: dark;
        }

        /* ---------- Base ---------- */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: var(--side-w) minmax(0, 1fr);
            grid-template-rows: var(--header-h) 1fr;
            grid-template-areas:
                "header header"
                "side   main";
            background:
                radial-gradient(900px 420px at 70% 0%, var(--bg-glow), transparent 70%),
                var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            transition: background-color .25s, color .25s;
        }

        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

        .icon {
            width: 18px;
            height: 18px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Header ---------- */
        header {
            grid-area: header;
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 24px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--line);
        }

        .Logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: auto;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .Logo img {
            display: block;
            height: 48px;       /* change this to make the logo bigger or smaller */
            width: auto;        /* keeps the original proportions */
            max-width: 200px;
            object-fit: contain;
        }

        .theme-toggle { order: 1; }
        header nav { order: 2; display: flex; }

        .account {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: .92rem;
            color: var(--ink);
            transition: background .15s;
        }

        .account:hover { background: var(--accent-soft); }

        .account .avatar {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--ink-soft);
            color: var(--ink-soft);
        }

        .account .icon:last-child { width: 14px; height: 14px; color: var(--ink-soft); }

        /* ---------- Theme toggle ---------- */
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            color: var(--ink-soft);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle .track {
            position: relative;
            width: 42px;
            height: 22px;
            border-radius: 999px;
            background: var(--accent);
        }

        .theme-toggle .knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform .2s;
        }

        .theme-toggle[aria-checked="true"] .knob { transform: translateX(20px); }

        /* ---------- Sidebar ---------- */
        #left {
            grid-area: side;
            position: sticky;
            top: var(--header-h);
            height: calc(100vh - var(--header-h));
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 22px 16px;
            background: var(--side-bg);
            border-right: 1px solid var(--line);
            overflow-y: auto;
        }

        #pg, #extra, #logout { display: flex; flex-direction: column; gap: 4px; }

        #extra { padding-top: 18px; border-top: 1px solid var(--line); }
        #logout { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }

        #left a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: .95rem;
            color: var(--ink);
            transition: background .15s;
        }

        #left a:hover { background: var(--accent-soft); }

        #left a.active { background: var(--accent); color: var(--accent-ink); }

        #left a .chev { margin-left: auto; width: 16px; height: 16px; }

        #extra a .icon, #logout a .icon, #pg a .icon { color: var(--ink-soft); }
        #pg a.active .icon { color: var(--accent-ink); }

        .lang {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 7px;
            font-size: .78rem;
            font-weight: 800;
            color: #fff;
        }

        .lang.c    { background: #1f8bff; }
        .lang.cpp  { background: #e0383e; }
        .lang.java { background: #f5822a; }
        #left a.active .lang.cpp { background: #fff; color: var(--accent); }

        /* ---------- Main ---------- */
        #c-body {
            grid-area: main;
            min-width: 0;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px clamp(16px, 3vw, 40px) 48px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Hero */
        .hero { position: relative; display: flex; flex-direction: column; gap: 22px; }

        #title { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }

        #title .hex { width: 92px; height: 92px; flex: none; filter: drop-shadow(0 8px 20px rgba(229, 23, 63, .45)); }

        #title h1 {
            margin: 0;
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            line-height: 1.1;
            letter-spacing: -.02em;
        }

        #title p { margin: 6px 0 0; color: var(--ink-soft); font-size: 1.1rem; }

        .hero-art {
            position: absolute;
            top: -34px;
            right: -10px;
            width: min(560px, 52%);
            height: auto;
            pointer-events: none;
        }

        /* Feature pills */
        #main-features-c {
            position: relative;
            z-index: 1;
            align-self: flex-start;
            display: flex;
            flex-wrap: wrap;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        #main-features-c > div {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
        }

        #main-features-c > div + div { border-left: 1px solid var(--line); }

        #main-features-c .icon { color: var(--accent); width: 22px; height: 22px; }
        #main-features-c h4 { margin: 0; font-size: .88rem; font-weight: 500; }

        /* Layout columns */
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ---------- Editor panel ---------- */
        #editor-panel { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

        #input-c { display: flex; align-items: center; gap: 8px; }

        #scroll-c { flex: 1; min-width: 0; overflow-x: auto; }

        #tabs { display: flex; gap: 8px; }

        #tab {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-bottom: 2px solid var(--accent);
            border-radius: 10px 10px 0 0;
            cursor: default;
        }

        #fileInput {
            width: 10ch;
            padding: 0;
            font: inherit;
            font-size: .92rem;
            color: var(--ink);
            background: none;
            border: 0;
            outline: none;
        }

        #fileInput:focus { text-decoration: underline; text-decoration-color: var(--accent); }

        .icon-btn {
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            padding: 0;
            background: none;
            border: 0;
            border-radius: 8px;
            color: var(--ink-soft);
            cursor: pointer;
        }

        .icon-btn:hover { background: var(--accent-soft); color: var(--ink); }

        .icon-btn.boxed { border: 1px solid var(--line); background: var(--panel-2); width: 36px; height: 36px; }

        .text-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: .88rem;
            color: var(--ink);
            cursor: pointer;
        }

        .text-btn:hover { background: var(--accent-soft); }

        /* Code editor */
        .editor {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr);
            height: 340px;
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 15px;
            line-height: 24px;
        }

        .editor.expanded { height: 620px; }

        #lines {
            margin: 0;
            padding: 12px 12px 12px 0;
            text-align: right;
            color: var(--ink-soft);
            border-right: 1px solid var(--line);
            overflow: hidden;
            user-select: none;
            white-space: pre;
        }

        .code-wrap { position: relative; min-width: 0; }

        #hl, #input {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 12px 16px;
            border: 0;
            font: inherit;
            letter-spacing: 0;
            white-space: pre;
            tab-size: 4;
        }

        #hl { overflow: hidden; color: var(--ink); pointer-events: none; }

        #input {
            width: 100%;
            height: 100%;
            overflow: auto;
            resize: none;
            color: transparent;
            caret-color: var(--ink);
            background: transparent;
            outline: none;
        }

        #input::selection { background: rgba(229, 23, 63, .35); }
        #input::placeholder { color: var(--ink-soft); opacity: .7; }

        .tk-c { color: var(--tk-comment); font-style: italic; }
        .tk-p { color: var(--tk-pre); }
        .tk-h, .tk-s { color: var(--tk-string); }
        .tk-k { color: var(--tk-keyword); }
        .tk-n { color: var(--tk-number); }

        /* Controls */
        .controls { display: flex; align-items: center; gap: 12px; }

        #run {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 26px;
            font-weight: 600;
            color: var(--accent-ink);
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(229, 23, 63, .35);
            transition: filter .15s, transform .05s;
        }

        #run:hover { filter: brightness(1.1); }
        #run:active { transform: translateY(1px); }
        #run .icon { width: 16px; height: 16px; }




        /* ---------- Output panel ---------- */
        #output-panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

        .panel-head { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .panel-head .icon { color: var(--ink-soft); }
        .panel-head .icon-btn { margin-left: auto; }

        #output {
            width: 100%;
            height: 200px;
            min-height: 120px;
            padding: 14px 16px;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: .92rem;
            line-height: 1.7;
            color: var(--ink);
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            resize: vertical;
        }

        #output:focus { outline: none; border-color: var(--accent); }
        #output.error { color: var(--danger); }
        #output::placeholder { color: var(--ink-soft); opacity: .7; }

        /* ---------- Responsive ---------- */
        @media (max-width: 1100px) {
            .layout { grid-template-columns: minmax(0, 1fr); }
            .hero-art { display: none; }
        }

        @media (max-width: 800px) {
            body {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: var(--header-h) auto 1fr;
                grid-template-areas: "header" "side" "main";
            }

            header { padding: 0 14px; gap: 10px; }
            .account span { display: none; }

            #left {
                position: static;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 10px 14px;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            #pg, #extra, #logout { flex-direction: row; flex-wrap: wrap; border-top: 0; padding-top: 0; }
            #logout { margin: 0 0 0 auto; }
            #left a .chev { display: none; }

            #title .hex { width: 64px; height: 64px; }
            .controls { flex-wrap: wrap; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

    <header>

        <div class="Logo">
            <img src="./final.png" alt="">
        </div>

        <nav>
            <a href="account.html" class="account">
                <span class="avatar"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></span>
                <span>Account</span>
                <svg class="icon" aria-hidden="true"><use href="#i-chev-d"/></svg>

        <button id="Toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">

    </header>

    <aside id="left">
        <div id="pg">
            <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a>

    <main id="c-body">

        <section class="hero">
            <svg class="hero-art" viewBox="0 0 600 260" aria-hidden="true">
                <defs>
                    <radialGradient id="gGlow">
                        <stop offset="0" stop-color="#ff2a50" stop-opacity=".55"/>
                        <stop offset="1" stop-color="#ff2a50" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="gScr" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#5a0f22"/>
                        <stop offset="1" stop-color="#240814"/>
                    </linearGradient>
                </defs>
                <path d="M0 200 C80 120 160 170 240 110 S400 60 600 120 V260 H0z" fill="#c8102e" opacity=".14"/>
                <ellipse cx="330" cy="222" rx="230" ry="30" fill="url(#gGlow)"/>
                <polygon points="250,30 440,14 432,160 244,176" fill="url(#gScr)" stroke="#ff4a63" stroke-width="3" stroke-linejoin="round"/>
                <polygon points="226,176 432,160 480,190 262,212" fill="#b0112b" stroke="#ff6f83" stroke-width="2" stroke-linejoin="round"/>
                <text x="340" y="110" text-anchor="middle" font-size="64" font-weight="700" fill="#ff4a63" font-family="ui-monospace, monospace">&lt;/&gt;</text>
                <use href="#hex-c" x="60" y="68" width="100" height="100"/>
                <use href="#hex-c" x="470" y="64" width="90" height="90"/>
            </svg>

            <div id="title">
                <svg class="hex" viewBox="0 0 100 100" aria-hidden="true"><use href="#hex-c"/></svg>
                <div>
                    <h1 id="c-h1">C++ Compiler</h1>
                    <p>Powerful. Fast. Reliable.</p>
                </div>
            </div>

            <div id="main-features-c">
                <div>
                    <svg class="icon" aria-hidden="true"><use href="#i-bolt"/></svg>
                    <h4>Fast Compilation</h4>
                </div>

                <div>
                    <svg class="icon" aria-hidden="true"><use href="#i-code"/></svg>
                    <h4>Supports Standard C++</h4>
                </div>

                <div>
                    <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
                    <h4>Reliable &amp; Secure</h4>
                </div>
            </div>
        </section>

        <div class="layout">

            <!-- Left column: editor + output -->
            <div class="col">

                <section id="editor-panel" class="panel">

                    <div id="input-c">
                        <section id="scroll-c">
                            <div id="tabs">
                                <div id="tab">
                                    <svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>
                                    <input type="text" id="fileInput" value="main.cpp" placeholder="File name" aria-label="File name" spellcheck="false">
                                    <button id="closeTab" class="icon-btn" type="button" aria-label="Close file" style="width:22px;height:22px;"><svg class="icon" style="width:14px;height:14px" aria-hidden="true"><use href="#i-x"/></svg></button>
                                </div>
                            </div>
                        </section>

                        <button id="clearBtn" class="text-btn" type="button"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Clear</button>
                        <button id="expandBtn" class="icon-btn boxed" type="button" aria-label="Expand editor"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button>
                    </div>

                    <div class="editor" id="editor">
                        <pre id="lines" aria-hidden="true">1</pre>
                        <div class="code-wrap">
                            <pre id="hl" aria-hidden="true"></pre>
                            <textarea id="input" rows="10" wrap="off" spellcheck="false" placeholder="Write your code here..." aria-label="Code editor"></textarea>
                        </div>
                    </div>

                    <div class="controls">
                        <button id="run" type="button"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>Run</button>
                    </div>

                </section>

                <section id="output-panel" class="panel">
                    <div class="panel-head">
                        <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>
                        <label for="output">Output</label>
                        <button id="copyBtn" class="icon-btn" type="button" aria-label="Copy output"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button>
                    </div>
                    <textarea id="output" rows="6" readonly spellcheck="false" placeholder="Output will appear here..."></textarea>
                </section>

            </div>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        // ---------- Dark mode toggle ----------
        const root = document.documentElement;
        const toggle = document.getElementById("Toggle");

        function setTheme(theme) {
            root.setAttribute("data-theme", theme);
            toggle.setAttribute("aria-checked", theme === "dark");
            try { localStorage.setItem("lexify-theme", theme); } catch (e) {}
        }

        let saved = null;
        try { saved = localStorage.getItem("lexify-theme"); } catch (e) {}
        setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        toggle.addEventListener("click", () => {
            setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
        });

        // ---------- Elements ----------
        const codeBox   = document.getElementById("input");
        const hl        = document.getElementById("hl");
        const lines     = document.getElementById("lines");
        const outputBox = document.getElementById("output");
        const fileInput = document.getElementById("fileInput");
        const editor    = document.getElementById("editor");

        // ---------- Syntax highlighting + line numbers ----------
        const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const TOKEN = new RegExp([
            "(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)",                 // 1 comment
            "(^[ \\t]*#[ \\t]*\\w+)",                                  // 2 preprocessor
            "(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*')",  // 3 string / char
            "(<(?:iostream|vector|string|cmath|algorithm|map|set|fstream|sstream|cstdio|cstdlib|cstring|iomanip|queue|stack|list|array|memory|utility|numeric|stdio\\.h|stdlib\\.h|string\\.h|math\\.h)>)",                                        // 4 header
            "\\b(int|char|float|double|void|long|short|unsigned|signed|const|static|struct|typedef|enum|if|else|for|while|do|switch|case|default|break|continue|return|sizeof|class|public|private|protected|namespace|using|new|delete|bool|true|false|auto|template|typename|virtual|this|nullptr|try|catch|throw)\\b", // 5 keyword
            "\\b(\\d+(?:\\.\\d+)?)\\b"                                 // 6 number
        ].join("|"), "gm");

        const CLASSES = [null, "tk-c", "tk-p", "tk-s", "tk-h", "tk-k", "tk-n"];

        function highlight(src) {
            let out = "", last = 0, m;
            TOKEN.lastIndex = 0;
            while ((m = TOKEN.exec(src)) !== null) {
                if (m[0] === "") { TOKEN.lastIndex++; continue; }
                out += esc(src.slice(last, m.index));
                const idx = m.findIndex((v, i) => i > 0 && v !== undefined);
                out += '<span class="' + CLASSES[idx] + '">' + esc(m[0]) + "</span>";
                last = m.index + m[0].length;
            }
            return out + esc(src.slice(last)) + "\n";
        }

        function refreshEditor() {
            hl.innerHTML = highlight(codeBox.value);
            const count = codeBox.value.split("\n").length;
            let nums = "";
            for (let i = 1; i <= count; i++) nums += i + "\n";
            lines.textContent = nums;
            syncScroll();
        }

        function syncScroll() {
            hl.scrollTop = lines.scrollTop = codeBox.scrollTop;
            hl.scrollLeft = codeBox.scrollLeft;
        }

        codeBox.addEventListener("input", refreshEditor);
        codeBox.addEventListener("scroll", syncScroll);

        // Tab key inserts 4 spaces instead of moving focus
        codeBox.addEventListener("keydown", e => {
            if (e.key === "Tab") {
                e.preventDefault();
                const s = codeBox.selectionStart;
                codeBox.setRangeText("    ", s, codeBox.selectionEnd, "end");
                refreshEditor();
            }
        });

        // ---------- Examples ----------
        const EXAMPLES = {
            hello: [
                "#include <iostream>",
                "using namespace std;",
                "",
                "int main() {",
                '    cout << "Hello, C++!" << endl;',
                "    return 0;",
                "}"
            ],
            vars: [
                "#include <iostream>",
                "#include <string>",
                "using namespace std;",
                "",
                "int main() {",
                "    int age = 21;",
                "    double height = 1.75;",
                "    char grade = 'A';",
                '    string name = "Lexify";',
                '    cout << name << " is " << age << " years old" << endl;',
                '    cout << "Height: " << height << endl;',
                '    cout << "Grade: " << grade << endl;',
                "    return 0;",
                "}"
            ],
            loops: [
                "#include <iostream>",
                "using namespace std;",
                "",
                "int main() {",
                "    for (int i = 1; i <= 5; i++) {",
                "        if (i % 2 == 0) {",
                '            cout << i << " is even" << endl;',
                "        } else {",
                '            cout << i << " is odd" << endl;',
                "        }",
                "    }",
                "    return 0;",
                "}"
            ],
            functions: [
                "#include <iostream>",
                "using namespace std;",
                "",
                "int add(int a, int b) {",
                "    return a + b;",
                "}",
                "",
                "int main() {",
                '    cout << "Sum: " << add(3, 4) << endl;',
                "    return 0;",
                "}"
            ],
            classes: [
                "#include <iostream>",
                "#include <string>",
                "using namespace std;",
                "",
                "class Car {",
                "public:",
                "    string name;",
                "    void drive() {",
                '        cout << name << " is driving" << endl;',
                "    }",
                "};",
                "",
                "int main() {",
                "    Car car;",
                '    car.name = "Tesla";',
                "    car.drive();",
                "    return 0;",
                "}"
            ]
        };

        function loadCode(text) {
            codeBox.value = text;
            codeBox.scrollTop = codeBox.scrollLeft = 0;
            refreshEditor();
        }

        // ---------- Tab / toolbar buttons ----------
        function newFile(name) {
            fileInput.value = name;
            loadCode("");
            outputBox.value = "";
            outputBox.classList.remove("error");
            codeBox.focus();
        }

        document.getElementById("closeTab").addEventListener("click", () => newFile("main.cpp"));

        document.getElementById("clearBtn").addEventListener("click", () => {
            loadCode("");
            outputBox.value = "";
            outputBox.classList.remove("error");
            codeBox.focus();
        });

        document.getElementById("expandBtn").addEventListener("click", () => {
            editor.classList.toggle("expanded");
        });

        // ---------- Run ----------
        // DEMO ONLY: this fakes output by echoing the string literals found in cout << ... statements.
        // Replace the body of this click handler with a call to your real compile/run API
        // and put the response text into outputBox.value.
        document.getElementById("run").addEventListener("click", () => {
            const code = codeBox.value;
            outputBox.classList.remove("error");

            if (!code.trim()) {
                outputBox.classList.add("error");
                outputBox.value = "Nothing to run. Write some code first.";
                return;
            }

            if (!/\bmain\s*\(/.test(code)) {
                outputBox.classList.add("error");
                outputBox.value = "error: undefined reference to `main'\n[Process exited with code 1]";
                return;
            }

            let text = "";
            const stmts = code.match(/\bcout\s*<<[^;]*;/g) || [];
            stmts.forEach(stmt => {
                const body = stmt.replace(/^cout\s*/, "").replace(/;$/, "");
                body.split(/<<(?=(?:[^"]*"[^"]*")*[^"]*$)/).forEach(part => {
                    part = part.trim();
                    if (part === "endl") { text += "\n"; return; }
                    const lit = part.match(/^"((?:\\.|[^"\\])*)"$/);
                    if (lit) text += lit[1].replace(/\\n/g, "\n").replace(/\\t/g, "\t").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
                });
            });

            outputBox.value = (text ? text.replace(/\n?$/, "\n") : "") + "[Process exited with code 0]";
        });

        // ---------- Copy output ----------
        document.getElementById("copyBtn").addEventListener("click", async e => {
            const btn = e.currentTarget;
            try {
                await navigator.clipboard.writeText(outputBox.value);
                btn.firstElementChild.firstElementChild.setAttribute("href", "#i-check");
                setTimeout(() => btn.firstElementChild.firstElementChild.setAttribute("href", "#i-copy"), 1200);
            } catch (err) {
                outputBox.select();
            }
        });

        // ---------- Start with the Hello World example ----------
        loadCode(EXAMPLES.hello.join("\n"));
        outputBox.value = "Hello, C++!\n[Process exited with code 0]";
    </script>
</body>
</html>
